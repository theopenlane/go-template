env:
  SONAR_HOST: "https://sonarcloud.io"
  SONAR_USER_HOME: $HOME/.sonar"
  SCANNER_WORKDIR_PATH: $HOME/sonar-scanner-work

steps:
  - group: ":test_tube: Tests"
    key: "tests"
    steps:
      - label: ":golangci-lint: lint :lint-roller:"
        key: "lint"
        cancel_on_build_failing: true
        plugins:
          - docker#v5.14.0:
              image: "golangci/golangci-lint:v2.15.0-alpine"
              always-pull: true
              command: ["go", "tool", "task", "go:lint"]
              environment:
                - "GOTOOLCHAIN=auto"
      - label: ":golang: go test"
        key: "go_test"
        cancel_on_build_failing: true
        plugins:
          - docker#v5.14.0:
              image: "golang:1.27-alpine"
              always-pull: true
              command: ["go", "tool", "task", "go:test:cover"]
              environment:
                - "GOTOOLCHAIN=auto"
        artifact_paths: ["coverage.out"]
      - label: ":github: upload PR reports"
        key: "scan-upload-pr"
        if: build.pull_request.id != null
        depends_on: ["go_test"]
        plugins:
          - cluster-secrets#v1.0.0:
              variables:
                SONAR_TOKEN: SONAR_TOKEN
          - artifacts#v1.11.0:
              download: "coverage.out"
              step: "go_test"
          - docker#v5.14.0:
              image: "sonarsource/sonar-scanner-cli:12.3"
              environment:
                - "SONAR_TOKEN"
                - "SONAR_HOST_URL=$SONAR_HOST"
                - "SONAR_SCANNER_OPTS=-Dsonar.pullrequest.branch=$BUILDKITE_BRANCH -Dsonar.pullrequest.base=$BUILDKITE_PULL_REQUEST_BASE_BRANCH -Dsonar.pullrequest.key=$BUILDKITE_PULL_REQUEST"
      - label: ":github: upload reports"
        key: "scan-upload"
        if: build.branch == "main"
        depends_on: ["go_test"]
        plugins:
          - cluster-secrets#v1.0.0:
              variables:
                SONAR_TOKEN: SONAR_TOKEN
          - artifacts#v1.11.0:
              download: coverage.out
              step: "go_test"
          - docker#v5.14.0:
              image: "sonarsource/sonar-scanner-cli:12.3"
              environment:
                - "SONAR_TOKEN"
                - "SONAR_HOST_URL=$SONAR_HOST"
